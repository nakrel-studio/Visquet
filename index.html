<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visquet</title>
    
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="videos_data.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+JP:wght@700&display=swap');
        body { background-color: #0d0d0f; color: #e1e1e6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .brand-logo { font-family: 'Noto Serif JP', serif; font-weight: 700; color: #fff; }
        .sidebar { border-right: 1px solid #222225; background-color: #0a0a0c; z-index: 40; }
        .nav-item { transition: 0.2s; cursor: pointer; color: #94a3b8; }
        .nav-item:hover { color: #fff; background-color: rgba(255, 255, 255, 0.05); }
        .nav-item.active { color: #3b82f6; background-color: rgba(59, 130, 246, 0.1); border-left: 3px solid #3b82f6; font-weight: 600; }
        .video-card { background: #141417; border: 1px solid transparent; transition: all 0.25s ease; }
        .video-card:hover { border-color: #333336; transform: translateY(-3px); }
        .info-card { background: #111114; border: 1px solid #222; }
        .icon-nakrel-n { width: 40px; height: 40px; flex-shrink: 0; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-72 sidebar hidden md:flex flex-col p-8 sticky top-0 h-screen">
        <div class="brand-logo text-3xl mb-12 tracking-tight">Visquet</div>
        
        <nav id="category-menu" class="space-y-1 flex-grow text-sm">
            <div class="text-[10px] text-gray-600 uppercase tracking-[0.2em] mb-3 mt-2">Archives</div>
            <div class="nav-item active p-3 rounded-r-lg" onclick="switchCategory('all', this)">All</div>
            <div class="nav-item p-3 rounded-r-lg" onclick="switchCategory('music', this)">Music</div>
            <div class="nav-item p-3 rounded-r-lg" onclick="switchCategory('games', this)">Game</div>
            <div class="nav-item p-3 rounded-r-lg" onclick="switchCategory('popular', this)">Popular</div>
            
            <div class="text-[10px] text-gray-600 uppercase tracking-[0.2em] mb-3 mt-8">Official Channels</div>
            <div class="nav-item p-3 rounded-r-lg flex items-center justify-between group" onclick="window.open('https://www.youtube.com/channel/UCNM9LH6S2dAOHvTAC97m-DA')">
                <span>NAKREL Studio</span>
                <span class="text-[10px] opacity-0 group-hover:opacity-100 transition">↗</span>
            </div>
            <div class="nav-item p-3 rounded-r-lg flex items-center justify-between group" onclick="window.open('https://www.youtube.com/channel/UCCUXJLya69B7qZ0gQ3oh62Q')">
                <span>YUKOV Circle Music</span>
                <span class="text-[10px] opacity-0 group-hover:opacity-100 transition">↗</span>
            </div>

            <div class="text-[10px] text-gray-600 uppercase tracking-[0.2em] mb-3 mt-8">System</div>
            <div class="nav-item p-3 rounded-r-lg" onclick="showInfo(this)">Info</div>
        </nav>

        <div class="mt-auto pt-6 border-t border-gray-800 flex items-center justify-between group">
            <div class="text-[9px] text-gray-700 font-mono tracking-tighter">
                SYS: VISQUET_ENGINE_v4.4 // STATUS: <span class="text-green-900 group-hover:text-blue-600 transition">STATIC_SYNCED</span>
            </div>
        </div>
    </aside>

    <main class="flex-grow p-6 md:p-12">
        <header id="main-header" class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
            <div>
                <h2 id="current-category-name" class="text-2xl font-semibold tracking-tight text-white capitalize">All Works</h2>
                <p class="text-xs text-gray-500 font-mono mt-1" id="video-count">LOADING...</p>
            </div>
            <div class="relative w-full md:w-80">
                <input type="text" id="search-input" placeholder="Search videos..." 
                    class="w-full bg-gray-900 border border-gray-800 rounded-full py-2.5 px-10 text-sm focus:outline-none focus:border-blue-500 transition">
            </div>
        </header>

        <div id="content-area">
            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-8"></div>
        </div>
    </main>

    <script>
        // 状態管理
        let currentRawVideos = []; // 選択中のカテゴリの生データ全件（検索スキャン用）
        let filteredVideos = [];   // 検索条件適用後のデータリスト
        let displayedCount = 0;    // 現在画面にレンダリング済みの本数
        const ITEMS_PER_PAGE = 12; // 1ページ（1スクロール）あたりに出す動画カード数
        let currentKey = 'all';

        // ページ読み込み完了時のエントリーポイント
        document.addEventListener("DOMContentLoaded", () => {
            loadVideosFromStaticFile('all');
            window.addEventListener('scroll', handleScroll);
            setupSearchEngine();
        });

        // 1. カテゴリ切り替え（Infoの残骸を完全に破壊して初期化するよう修正）
        function switchCategory(key, element) {
            currentKey = key;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            // ヘッダーエリアを確実に表示状態に戻す
            document.getElementById('main-header').style.display = 'flex';
            document.getElementById('current-category-name').innerText = key === 'all' ? 'All Works' : key.replace(/([A-Z])/g, ' $1').trim();
            
            // 💡 Info画面を完全に消滅させ、更地から新しく動画用のgridコンテナを注入
            document.getElementById('content-area').innerHTML = '<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-8"></div>';
            document.getElementById('search-input').value = '';
            
            loadVideosFromStaticFile(key);
        }

        // 2. staticデータファイルからデータを高速ロード
        function loadVideosFromStaticFile(key) {
            const grid = document.getElementById('grid');
            
            if (typeof VISQUET_ARCHIVE_DATA === 'undefined' || !VISQUET_ARCHIVE_DATA[key]) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-24 font-mono text-gray-700 text-xs uppercase tracking-widest">
                        [ ARCHIVE_OFFLINE ]<br><br>
                        <span class="text-gray-500 text-[10px]">現在メンテナンス中か、データ同期の準備中です。</span>
                    </div>`;
                document.getElementById('video-count').innerText = `ITEMS: 0`;
                return;
            }

            currentRawVideos = VISQUET_ARCHIVE_DATA[key];
            filteredVideos = [...currentRawVideos]; // 初期ロード時は全件をターゲットにする
            
            resetAndRender();
        }

        // 3. レんだリング状態の初期化
        function resetAndRender() {
            displayedCount = 0;
            const grid = document.getElementById('grid');
            if (grid) grid.innerHTML = '';
            
            if (filteredVideos.length === 0) {
                if (grid) grid.innerHTML = `<div class="col-span-full text-center py-12 font-mono text-gray-700 text-xs uppercase">NO_ITEMS_FOUND</div>`;
                document.getElementById('video-count').innerText = `FOUND: 0 / TOTAL: ${currentRawVideos.length}`;
                return;
            }

            // 最初の12本を表示
            loadNextChunk();
            updateItemCountMessage();
        }

        // 4. 動画を12本ずつ小出しにレンダリングする関数（無限スクロール・検索共通）
        function loadNextChunk() {
            const grid = document.getElementById('grid');
            if (!grid || displayedCount >= filteredVideos.length) return;

            const chunk = filteredVideos.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
            
            const htmlString = chunk.map(v => `
                <div class="video-card rounded-xl overflow-hidden cursor-pointer shadow-2xl animate-fade-in" onclick="window.open('https://youtu.be/${v.videoId}')">
                    <div class="relative group">
                        <img src="${v.thumbnailBase64}" class="w-full aspect-video object-cover bg-gray-900" loading="lazy">
                        <div class="absolute inset-0 bg-blue-600/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
                    </div>
                    <div class="p-5">
                        <h3 class="text-[11px] font-bold line-clamp-2 text-gray-300 leading-relaxed tracking-wide">${v.title}</h3>
                        <div class="mt-4 flex justify-between items-center text-[8px] text-gray-600 font-mono uppercase tracking-tighter">
                             <span>${v.publishedAt}</span>
                             <span>ID: ${v.videoId}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            grid.insertAdjacentHTML('beforeend', htmlString);
            displayedCount += chunk.length;
        }

        // 5. 無限スクロールのトリガーセンサー
        function handleScroll() {
            const grid = document.getElementById('grid');
            if (!grid) return; // Info画面の時はスクロール処理をバイパスする

            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            if (scrollTop + clientHeight >= scrollHeight - 150) {
                loadNextChunk();
            }
        }

        // 6. ローカル検索エンジン（非表示の動画データも一瞬で全検索）
        function setupSearchEngine() {
            const searchInput = document.getElementById('search-input');
            if (!searchInput) return;

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                
                if (query === '') {
                    filteredVideos = [...currentRawVideos];
                } else {
                    filteredVideos = currentRawVideos.filter(v => 
                        v.title.toLowerCase().includes(query) || 
                        v.videoId.toLowerCase().includes(query)
                    );
                }
                
                resetAndRender();
            });
        }

        // 7. アイテム件数ヘッダー表示の最適化
        function updateItemCountMessage() {
            const countEl = document.getElementById('video-count');
            if (!countEl) return;

            if (currentRawVideos.length === filteredVideos.length) {
                countEl.innerText = `ITEMS: ${currentRawVideos.length} (ARCHIVED)`;
            } else {
                countEl.innerText = `FOUND: ${filteredVideos.length} / TOTAL: ${currentRawVideos.length}`;
            }
        }

        // 8. インフォメーション表示（確実にcontent-areaそのものを書き換える仕様に統一）
        function showInfo(element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('main-header').style.display = 'none';
            
            document.getElementById('content-area').innerHTML = `
                <div class="max-w-2xl mx-auto space-y-10 py-10 animate-fade-in">
                    <section class="info-card p-8 rounded-2xl">
                        <h3 class="text-sm text-gray-500 uppercase tracking-widest mb-6 font-mono">/ Info</h3>
                        <div class="space-y-8">
                            <div>
                                <h4 class="text-white font-semibold mb-2">Version Info</h4>
                                <p class="text-sm text-gray-400 font-mono text-blue-500">Visquet v4.4 (Static Engine) // Build 2026.05</p>
                            </div>
                            <div>
                                <h4 class="text-white font-semibold mb-3">Members & Organizations</h4>
                                <ul class="text-sm text-gray-400 space-y-2 font-medium">
                                    <li class="flex items-center gap-2"><span class="w-1 h-1 bg-blue-500 rounded-full"></span> Richard</li>
                                    <li class="flex items-center gap-2"><span class="w-1 h-1 bg-blue-500 rounded-full"></span> YUKOV Circle Music</li>
                                    <li class="flex items-center gap-2"><span class="w-1 h-1 bg-blue-500 rounded-full"></span> 藤村拓真 / フジタク</li>
                                    <li class="flex items-center gap-2"><span class="w-1 h-1 bg-blue-500 rounded-full"></span> Riz</li>
                                </ul>
                            </div>
                        </div>
                    </section>
                    <section class="info-card p-8 rounded-2xl flex items-center gap-6 border-l-4 border-l-blue-600">
                        <svg viewBox="0 0 24 24" class="icon-nakrel-n" xmlns="http://www.w3.org/2000/svg">
                            <path d="M6 19L6 5M18 19L18 5" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M8.5 7.5L15.5 16.5" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                        <div>
                            <h4 class="text-[10px] text-gray-500 uppercase tracking-[0.3em] mb-1 font-mono">Operated Label</h4>
                            <div class="text-2xl font-bold text-white tracking-tighter">NAKREL Studio</div>
                        </div>
                    </section>
                </div>
            `;
        }
    </script>
</body>
</html>
