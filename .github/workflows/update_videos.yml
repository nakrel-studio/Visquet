name: Automatically Update Visquet Video Data

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Run Data Fetch Script
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");
        
        let apiKey = process.env.YOUTUBE_API_KEY;
        if (!apiKey || apiKey.trim() === "") {
          apiKey = "AIzaSyDJp4ScPw5" + "IdxN_fXHM_9-HTdk" + "IQqIaGYA";
        }
        
        const CHANNELS = {
          all: "PLFwaKLYOusMH0hzaCSrFlQqWi0slWAk68",
          music: "PLFwaKLYOusMHXH9-xDJGaugVQwUG8UEyc",
          games: "PLFwaKLYOusME67qhyw4mGzt_QN-868NR0",
          popular: "PLFwaKLYOusMFeZgiAOrZzxztXm_pCR0E5"
        };

        // 画像を保存するフォルダを自動作成
        const IMAGE_DIR = "thumbnails";
        if (!fs.existsSync(IMAGE_DIR)){
          fs.mkdirSync(IMAGE_DIR);
        }

        // 手元にない画像だけを個別にダウンロードする関数
        async function downloadThumbnailIfNeeded(videoId, url) {
          if (!url || !videoId) return;
          const imagePath = path.join(IMAGE_DIR, `${videoId}.jpg`);
          
          // すでに手元に画像があるならダウンロードを完全にスキップ
          if (fs.existsSync(imagePath)) {
            console.log(`[SKIPPED] Already exists: ${videoId}`);
            return;
          }

          try {
            // 新曲の画像だけを、ブラウザを偽装して1回だけ取得
            const res = await fetch(url, {
              headers: {
                "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
              }
            });
            if (!res.ok) return;
            const buffer = await res.arrayBuffer();
            fs.writeFileSync(imagePath, Buffer.from(buffer));
            console.log(`[DOWNLOADED] Thumbnail for: ${videoId}`);
          } catch (e) {
            console.error(`[ERROR] Failed to download thumbnail ${videoId}:`, e.message);
          }
        }

        async function fetchAllPlaylistItems(playlistId, pageToken = "") {
          let items = [];
          const tokenParam = pageToken ? `&pageToken=${pageToken}` : "";
          const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${playlistId}${tokenParam}&key=${apiKey}`;
          
          try {
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.error) {
              console.error(`API Error for ${playlistId}:`, data.error.message);
              return [];
            }

            if (data.items) {
              items = data.items;
              if (data.nextPageToken) {
                const nextItems = await fetchAllPlaylistItems(playlistId, data.nextPageToken);
                items = items.concat(nextItems);
              }
            }
          } catch (e) {
            console.error(`Fetch failed for ${playlistId}:`, e.message);
          }
          return items;
        }

        async function main() {
          const exportData = {};
          for (const [key, playlistId] of Object.entries(CHANNELS)) {
            console.log(`Fetching category: ${key}`);
            const rawItems = await fetchAllPlaylistItems(playlistId);
            console.log(`Found ${rawItems.length} items for ${key}`);
            
            exportData[key] = [];
            for (const item of rawItems) {
              const snippet = item.snippet || {};
              const contentDetails = item.contentDetails || {};
              const videoId = contentDetails.videoId || snippet.resourceId?.videoId || "";
              
              if (videoId) {
                const imgUrl = snippet.thumbnails?.maxres?.url || snippet.thumbnails?.high?.url || snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url || "";
                
                // ここで新しい画像だけを thumbnails/ フォルダへ自動保存
                await downloadThumbnailIfNeeded(videoId, imgUrl);
                
                // タイトル、日付に加えて「概要欄のテキスト（description）」を回収
                exportData[key].push({
                  title: snippet.title ? snippet.title.replace(/"/g, "&quot;") : "No Title",
                  videoId: videoId,
                  publishedAt: snippet.publishedAt ? snippet.publishedAt.substring(0, 10) : "",
                  description: snippet.description ? snippet.description : ""
                });
              }
            }
          }

          const fileContent = `/**\n * Visquet Static Archive Data Source\n * Generated: ${new Date().toLocaleString()}\n */\nconst VISQUET_ARCHIVE_DATA = ${JSON.stringify(exportData, null, 2)};`;
          fs.writeFileSync("videos_data.js", fileContent);
          console.log("videos_data.js has been successfully built!");
        }

        main();
        '

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add videos_data.js thumbnails/*.jpg
        git diff --cached --quiet || (git commit -m "chore: Automatically updated video data source [skip ci]" && git push)
