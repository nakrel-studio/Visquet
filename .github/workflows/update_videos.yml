name: Automatically Update Visquet Video Data

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Run Data Fetch Script
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      run: |
        node -e '
        const fs = require("fs");
        
        let apiKey = process.env.YOUTUBE_API_KEY;
        if (!apiKey || apiKey.trim() === "") {
          apiKey = "AIzaSyDJp4ScPw5" + "IdxN_fXHM_9-HTdk" + "IQqIaGYA";
        }
        
        const CHANNELS = {
          all: "PLFwaKLYOusMH0hzaCSrFlQqWi0slWAk68",
          music: "PLFwaKLYOusMHXH9-xDJGaugVQwUG8UEyc",
          games: "PLFwaKLYOusME67qhyw4mGzt_QN-868NR0",
          popular: "PLFwaKLYOusMFeZgiAOrZzxztXm_pCR0E5"
        };

        async function getBase64Image(url) {
          if (!url) return "";
          try {
            // 💡 Googleのブロックを回避するためにブラウザを偽装するヘッダーを追加
            const res = await fetch(url, {
              headers: {
                "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
              }
            });
            if (!res.ok) return url;
            const buffer = await res.arrayBuffer();
            const base64 = Buffer.from(buffer).toString("base64");
            const contentType = res.headers.get("content-type") || "image/jpeg";
            return `data:${contentType};base64,${base64}`;
          } catch (e) {
            return url; // 💡 万が一画像変換に失敗しても、URLを生かして処理を続行させる
          }
        }

        async function fetchAllPlaylistItems(playlistId, pageToken = "") {
          let items = [];
          const tokenParam = pageToken ? `&pageToken=${pageToken}` : "";
          const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=50&playlistId=${playlistId}${tokenParam}&key=${apiKey}`;
          
          try {
            const res = await fetch(url);
            const data = await res.json();
            
            if (data.error) {
              console.error(`API Error for ${playlistId}:`, data.error.message);
              return [];
            }

            if (data.items) {
              items = data.items;
              if (data.nextPageToken) {
                const nextItems = await fetchAllPlaylistItems(playlistId, data.nextPageToken);
                items = items.concat(nextItems);
              }
            }
          } catch (e) {
            console.error(`Fetch failed for ${playlistId}:`, e.message);
          }
          return items;
        }

        async function main() {
          const exportData = {};
          for (const [key, playlistId] of Object.entries(CHANNELS)) {
            console.log(`Fetching category: ${key}`);
            const rawItems = await fetchAllPlaylistItems(playlistId);
            console.log(`Found ${rawItems.length} items for ${key}`);
            
            exportData[key] = await Promise.all(rawItems.map(async (item) => {
              const snippet = item.snippet || {};
              const contentDetails = item.contentDetails || {};
              
              // サムネイルURLの安全な抽出
              const imgUrl = snippet.thumbnails?.high?.url || snippet.thumbnails?.medium?.url || snippet.thumbnails?.default?.url || "";
              
              // 画像のダウンロード処理
              const base64Thumb = imgUrl ? await getBase64Image(imgUrl) : "";
              
              return {
                title: snippet.title ? snippet.title.replace(/"/g, "&quot;") : "No Title",
                videoId: contentDetails.videoId || snippet.resourceId?.videoId || "",
                publishedAt: snippet.publishedAt ? new Date(snippet.publishedAt).toLocaleDateString() : "",
                thumbnailBase64: base64Thumb
              };
            }));
          }

          const fileContent = `/**\n * Visquet Static Archive Data Source\n * Generated: ${new Date().toLocaleString()}\n */\nconst VISQUET_ARCHIVE_DATA = ${JSON.stringify(exportData, null, 2)};`;
          fs.writeFileSync("videos_data.js", fileContent);
          console.log("videos_data.js has been successfully built!");
        }

        main();
        '

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add videos_data.js
        git diff --cached --quiet || (git commit -m "chore: Automatically updated video data source [skip ci]" && git push)
