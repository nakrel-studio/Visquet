<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visquet - Player</title>
    
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    
    <style>
    button, a, .no-zoom {
      touch-action: manipulation;
    }
  </style>
</head>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        document.write('<script src="videos_data.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    <script>
        // 🌗 ページのレンダリングが始まる前に、グローバルスコープで最速でテーマを判定・適用する
        window.syncTheme = function() {
            const theme = localStorage.getItem('visquet-theme') || 'light';
            const htmlEl = document.documentElement;
            if (theme === 'dark') {
                htmlEl.classList.add('dark');
            } else if (theme === 'light') {
                htmlEl.classList.remove('dark');
            } else if (theme === 'system') {
                const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (isSystemDark) {
                    htmlEl.classList.add('dark');
                } else {
                    htmlEl.classList.remove('dark');
                }
            }
        };
        // 即座に実行して、読み込みの一瞬だけ白く光る「フラッシュ現象」を防ぐ
        window.syncTheme();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+JP:wght@700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .brand-logo { font-family: 'Noto Serif JP', serif; font-weight: 700; user-select: none; }
        .player-container { background: #000; border: 1px solid #222225; border-radius: 0px !important; }
        .video-card { border: 1px solid transparent; transition: all 0.25s ease; border-radius: 0px !important; }
        .video-card:hover { transform: translateY(-3px); }
        .description-text { white-space: pre-wrap; word-break: break-word; }

        @keyframes fireFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
        .fire-particle {
            position: absolute; pointer-events: none;
            background: linear-gradient(to bottom, #ff7e15, #ff3c00);
            border-radius: 50%; z-index: 50;
            animation: fireFly 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen bg-[#f8f9fa] text-[#1e2022] dark:bg-[#0d0d0f] dark:text-[#e1e1e6]">

    <header class="w-full h-12 bg-[#f0f2f5] dark:bg-[#0a0a0c] border-b border-[#e2e8f0] dark:border-[#222225] flex items-center justify-between px-8 md:px-12 sticky top-0 z-50">
        <div class="flex items-center gap-8">
          <div class="cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">
            <img src="Visquet 1.PNG" alt="Visquet Logo" class="h-10 w-auto object-contain dark:brightness-110">
          </div>
            <button onclick="location.href='./index.html'" class="text-xs text-gray-500 dark:text-gray-400 font-mono uppercase bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-800 px-4 py-2 rounded-none hover:bg-gray-100 dark:hover:bg-gray-800 transition">
                ← 戻る
            </button>
        </div>
    </header>

 <!-- 調整箇所: xl:（横幅1280px以上）の時のみ右側に並べる設定。スクエアモニターやタブレットでは1列（上下配置）を維持 -->
 <main class="max-w-7xl mx-auto pt-2 px-4 md:px-12 md:pb-12 md:pt-2 grid grid-cols-1 xl:grid-cols-[1fr,1.2fr] gap-8">
        
        <div class="w-full">
            <div class="player-container w-full aspect-[4/3] overflow-hidden shadow-2xl mb-6">
                <iframe id="youtube-player" class="w-full h-full bg-black" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>

            <div class="mb-6">
                <h1 id="video-title" class="text-xl md:text-2xl font-bold tracking-tight text-[#000] dark:text-white leading-snug">LOADING ARCHIVE...</h1>
                <div class="mt-3 flex flex-wrap items-center gap-4 text-xs font-mono text-gray-400 dark:text-gray-500 uppercase">
                    <span id="video-date" class="font-semibold text-gray-700 dark:text-white">---</span>
                    <span id="video-id" class="text-gray-400 dark:text-gray-600 text-[10px]">ID: ---</span>
                </div>

                <div class="mt-4 flex flex-wrap items-center gap-3 font-mono text-xs uppercase tracking-wider">
                    <div class="border border-gray-200 dark:border-[#222225] px-4 py-2 bg-[#f0f2f5] dark:bg-[#0a0a0c] text-gray-500 dark:text-gray-400 font-bold">
                        👁 <span id="view-count" class="text-gray-950 dark:text-white">0</span>
                    </div>

                    <button id="like-btn" class="group border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] hover:bg-blue-50/50 dark:hover:bg-blue-950/20 px-2 py-1 text-gray-600 dark:text-gray-300 transition-all duration-200 active:scale-90 flex items-center gap-2 rounded-none relative">
                        <span id="like-icon" class="text-xl transition-transform duration-200 group-hover:scale-110 inline-block">👍</span>
                        <span class="font-semibold">高評価</span>
                        <span id="like-count" class="text-blue-600 dark:text-blue-400 font-extrabold ml-1 transition-transform duration-200">0</span>
                    </button>

                    <button id="fire-btn" class="group border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] hover:bg-orange-50/50 dark:hover:bg-orange-950/20 px-2 py-1 text-gray-600 dark:text-gray-300 transition-all duration-75 active:scale-95 flex items-center gap-2 rounded-none relative select-none overflow-visible">
                        <span id="fire-icon" class="text-xl inline-block transition-transform duration-75">🔥</span>
                        <span class="font-semibold tracking-widest">声援</span>
                        <span id="fire-count" class="text-orange-600 dark:text-orange-400 font-extrabold transition-transform duration-75">0</span>
                    </button>

                    <!-- SHARE（共有）ボタン -->
                    <button id="share-btn" class="group border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] hover:bg-emerald-50/50 dark:hover:bg-emerald-950/20 px-3 py-1 text-gray-600 dark:text-gray-300 transition-all duration-200 active:scale-90 flex items-center gap-2 rounded-none relative">
                        <span class="text-lg transition-transform duration-200 group-hover:scale-110 inline-block">🔗</span>
                        <span class="font-semibold">共有</span>
                    </button>
                </div>
            </div>
            
            <div class="p-6 rounded-none bg-white border border-gray-200 dark:bg-[#141417] dark:border-[#222225] mb-12">
                <h3 class="text-[12px] font-mono text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3">概要欄</h3>
                <div id="video-description" class="description-text text-sm text-gray-600 dark:text-gray-300 leading-relaxed font-medium">
                    データを展開しています...
                </div>
            </div>
        </div>

        <section class="w-full">
            <div class="flex justify-end mb-6">
               <p id="rec-count" class="text-[12px] text-gray-400 dark:text-gray-600 font-mono uppercase tracking-tighter">関連動画: 0</p>
            </div>
            <!-- 調整箇所: 中型（sm）〜大型（xl未満）では2列、右配置になるxlでのみ2列でコンパクトに表示 -->
            <div id="rec-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-2 gap-4"></div>
        </section>
    </main>

<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, increment, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAlH-GMToPdCL_b-k2n1bETAiNevkqcM5A",
            authDomain: "visquet-view.firebaseapp.com",
            projectId: "visquet-view",
            storageBucket: "visquet-view.firebasestorage.app",
            messagingSenderId: "110822314078",
            appId: "1:110822314078:web:0c4ca72bec50a0168324cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentVideoId = null;
        
        // まとめ送り（バッファリング）用の管理変数
        let pendingFires = 0;
        let fireTimeoutTimer = null;
   
function autoLink(text) {
  if (!text) return '';

  // HTMLエスケープ処理（&, <, >, ", ' を安全な文字列に変換）
  const escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

  const urlPattern = /(https?:\/\/[^\s<]+)/g;

  return escaped.replace(urlPattern, (url) => {
    // https://nakrel-visquet.com/watch.html で始まるURLだけ同じタブで開く
    const isWatchPage = url.startsWith('https://nakrel-visquet.com/watch.html');

    if (isWatchPage) {
      return `<a href="${url}" class="text-blue-500 dark:text-blue-400 hover:underline break-all">${url}</a>`;
    } else {
      return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-blue-500 dark:text-blue-400 hover:underline break-all">${url}</a>`;
    }
  });
}

      document.addEventListener("DOMContentLoaded", () => {
            // ページ読み込み時にグローバルなtheme同期を実行
            window.syncTheme(); 

            // システム設定変更時のリアルタイム追従リスナー
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (localStorage.getItem('visquet-theme') === 'system') {
                    window.syncTheme();
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            currentVideoId = urlParams.get('id');

            if (!currentVideoId) {
                location.href = './index.html';
                return;
            }

            const player = document.getElementById('youtube-player');
            // YouTubeプレイヤー自体のUIテーマもダークに変更
            player.src = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1&rel=0&theme=dark`;

            let targetVideo = null;
            if (typeof VISQUET_ARCHIVE_DATA !== 'undefined') {
                for (const key in VISQUET_ARCHIVE_DATA) {
                    const found = VISQUET_ARCHIVE_DATA[key].find(v => v.videoId === currentVideoId);
                    if (found) { targetVideo = found; break; }
                }
            }

            if (targetVideo) {
                document.getElementById('video-title').innerHTML = targetVideo.title;
                document.getElementById('video-date').innerText = `${targetVideo.publishedAt} に投稿`;
                document.getElementById('video-id').innerText = `ID: ${targetVideo.videoId}`;
                document.title = `${targetVideo.title.replace(/&quot;/g, '"')} - Visquet`;
                const descContainer = document.getElementById('video-description');
                if (targetVideo.description && targetVideo.description.trim() !== "") {
                    // autoLink関数でURLをハイパーリンクに変換して出力
                    descContainer.innerHTML = autoLink(targetVideo.description);
                } else {
                    descContainer.innerHTML = `<span class="text-gray-400 dark:text-gray-600 font-mono text-xs">[ 未記入 ]</span>`;
                }
            } else {
                document.getElementById('video-title').innerText = "Archived Video Stream";
                document.getElementById('video-date').innerText = "UNKNOWN DATE";
                document.getElementById('video-id').innerText = `ID: ${currentVideoId}`;
                document.getElementById('video-description').innerText = "動画情報をロードできませんでした。";
            }

            const likeBtn = document.getElementById('like-btn');
            const fireBtn = document.getElementById('fire-btn');
            const shareBtn = document.getElementById('share-btn');

            if (likeBtn) likeBtn.addEventListener('click', handleLike);
            if (fireBtn) fireBtn.addEventListener('click', handleFire);
            if (shareBtn) shareBtn.addEventListener('click', handleShare);

            initLocalCounters();
            renderRecommendations(currentVideoId);
        });

        async function initLocalCounters() {
            if (!currentVideoId) return;
            const docRef = doc(db, "video_metrics", currentVideoId);

            const hasViewed = sessionStorage.getItem(`v_session_${currentVideoId}`);
            if (!hasViewed) {
                try {
                    await setDoc(docRef, { views: increment(1), lastUpdatedAt: serverTimestamp() }, { merge: true });
                    sessionStorage.setItem(`v_session_${currentVideoId}`, "true");
                } catch (e) {
                    console.error("Firebase Views Sync Error:", e);
                }
            }

            const cacheKey = `vm_cache_${currentVideoId}`;
            const timeKey = `vm_time_${currentVideoId}`;
            const now = Date.now();

            const cachedData = localStorage.getItem(cacheKey);
            const lastFetchTime = localStorage.getItem(timeKey);

            let data = null;

            if (cachedData && lastFetchTime && (now - parseInt(lastFetchTime) < 10000)) {
                data = JSON.parse(cachedData);
            } else {
                try {
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        data = docSnap.data();
                        localStorage.setItem(cacheKey, JSON.stringify(data));
                        localStorage.setItem(timeKey, now.toString());
                    }
                } catch (e) {
                    console.error("Firebase Read Error:", e);
                }
            }

            if (data) {
                document.getElementById('view-count').innerText = (data.views || 0).toLocaleString();
                document.getElementById('like-count').innerText = (data.likes || 0).toLocaleString();
                document.getElementById('fire-count').innerText = (data.fires || 0).toLocaleString();
            } else {
                document.getElementById('view-count').innerText = "0";
                document.getElementById('like-count').innerText = "0";
                document.getElementById('fire-count').innerText = "0";
            }

            if (localStorage.getItem(`l_user_${currentVideoId}`)) disableLikeButtonUI();
            updateFireButtonUI();
        }

        async function handleLike(event) {
            if (localStorage.getItem(`l_user_${currentVideoId}`)) return;

            createPopupText(event, "+1 MAX", "text-blue-500 font-black");

            const countEl = document.getElementById('like-count');
            
            const docRef = doc(db, "video_metrics", currentVideoId);
            try {
                localStorage.removeItem(`vm_time_${currentVideoId}`); 
                localStorage.removeItem(`vm_cache_${currentVideoId}`);

                const currentLikes = parseInt(countEl.innerText.replace(/,/g, '')) || 0;
                countEl.innerText = (currentLikes + 1).toLocaleString();

                disableLikeButtonUI();

                await setDoc(docRef, { likes: increment(1), lastUpdatedAt: serverTimestamp() }, { merge: true });
                localStorage.setItem(`l_user_${currentVideoId}`, "true");
            } catch (e) {
                console.error("Like Error:", e);
            }          
        }

        function disableLikeButtonUI() {
            const btn = document.getElementById('like-btn');
            if (btn) {
                btn.classList.add('bg-gray-300', 'text-gray-600', 'border-gray-400', 'dark:bg-gray-800', 'dark:text-gray-400', 'dark:border-gray-700', 'cursor-not-allowed', 'pointer-events-none');
                btn.classList.remove('hover:bg-blue-50/50', 'dark:hover:bg-blue-950/20');
            }
        }

        // 最適化：まとめ送り（バッファリング）処理
        async function handleFire(event) {
            let userFireClicks = parseInt(localStorage.getItem(`f_user_click_${currentVideoId}`)) || 0;
            if (userFireClicks >= 50) return; 

            userFireClicks++;
            localStorage.setItem(`f_user_click_${currentVideoId}`, userFireClicks);

            // 送信用のバッファに加算
            pendingFires++;

            // 演出と手元の数字は「叩いた瞬間に1対1で超高速リアルタイム反映」
            createFireParticles(event);
            if (userFireClicks >= 50) {
                createPopupText(event, `+${userFireClicks} LIMIT !`, "text-red-500 font-black");
            } else {
                createPopupText(event, `+${userFireClicks}`, "text-orange-500 font-bold");
            }

            const countEl = document.getElementById('fire-count');
            const currentFires = parseInt(countEl.innerText.replace(/,/g, '')) || 0;
            countEl.innerText = (currentFires + 1).toLocaleString();

            updateFireButtonUI();

            // 連打している間はタイマーを何度もリセット（通信を発生させない）
            if (fireTimeoutTimer) clearTimeout(fireTimeoutTimer);

            // 連打の手が止まってから「0.4秒後」に、溜まった分をまとめて一発送信
            fireTimeoutTimer = setTimeout(async () => {
                const fireIncrementAmount = pendingFires;
                pendingFires = 0; // 送信開始したらバッファは即ゼロに戻す

                const docRef = doc(db, "video_metrics", currentVideoId);
                try {
                    localStorage.removeItem(`vm_time_${currentVideoId}`);
                    localStorage.removeItem(`vm_cache_${currentVideoId}`);

                    // まとめてドカンと加算（1通信で完結）
                    await setDoc(docRef, { fires: increment(fireIncrementAmount), lastUpdatedAt: serverTimestamp() }, { merge: true });
                } catch (e) {
                    console.error("Fire Debounce Sync Error:", e);
                }
            }, 400); 
        }

        // 共有シート（Web Share API）呼び出し処理
        async function handleShare(event) {
            const videoTitle = document.getElementById('video-title')?.innerText || "Visquet Video";
            
            const shareData = {
                title: videoTitle,
                text: videoTitle,
                url: window.location.href
            };

            // Web Share API（スマホやMacなどの共有シート機能）が開ける場合
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    // ユーザーが共有シートをキャンセルした場合はエラーにしない
                    if (err.name !== 'AbortError') {
                        console.error("Share failed:", err);
                    }
                }
            } else {
                // Web Share API非対応（一部PC環境等）の場合：URLをクリップボードにコピー
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    createPopupText(event, "URL COPIED!", "text-emerald-500 font-bold");
                } catch (err) {
                    console.error("Clipboard copy failed:", err);
                }
            }
        }

        function createFireParticles(e) {
            const btn = document.getElementById('fire-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let i = 0; i < 7; i++) {
                const p = document.createElement('div');
                p.classList.add('fire-particle');
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                const size = Math.random() * 8 + 6; 
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.setProperty('--x', `${(Math.random() - 0.5) * 100}px`);
                p.style.setProperty('--y', `${-Math.random() * 80 - 30}px`);
                btn.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        function createPopupText(e, text, colorClass) {
            const btn = e.currentTarget;
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const randomXOffset = (Math.random() - 0.5) * 30;
            const popup = document.createElement('div');
            popup.innerText = text;
            popup.className = `absolute pointer-events-none font-mono font-black text-xs px-1.5 py-0.5 bg-white dark:bg-[#141417] border border-gray-300 dark:border-[#222225] shadow-md z-50 ${colorClass} rounded-none`;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            popup.style.transform = 'translate(-50%, -100%)';
            popup.style.transition = 'all 5.0s cubic-bezier(0.1, 0.8, 0.1, 1)';
            btn.appendChild(popup);
            requestAnimationFrame(() => {
                popup.style.top = `${y - 75}px`;
                popup.style.left = `${x + randomXOffset}px`;
                popup.style.opacity = '0';
                popup.style.transform = 'translate(-50%, -100%) scale(0.9)';
            });
            setTimeout(() => popup.remove(), 5000);
        }

        function updateFireButtonUI() {
            const userFireClicks = parseInt(localStorage.getItem(`f_user_click_${currentVideoId}`)) || 0;
            if (userFireClicks >= 50) {
                const btn = document.getElementById('fire-btn');
                if (btn) {
                    btn.classList.add('bg-gray-300', 'text-gray-600', 'border-gray-400', 'dark:bg-gray-800', 'dark:text-gray-400', 'dark:border-gray-700', 'cursor-not-allowed', 'pointer-events-none');
                    btn.classList.remove('hover:bg-orange-50/50', 'dark:hover:bg-orange-950/20');
                }
            }
        }

     function renderRecommendations(currentId) {
            const recGrid = document.getElementById('rec-grid');
            const recCountEl = document.getElementById('rec-count');
            if (!recGrid || typeof VISQUET_ARCHIVE_DATA === 'undefined' || !VISQUET_ARCHIVE_DATA['all']) return;

            // 1. 自分自身の動画を除外
            let allVideos = VISQUET_ARCHIVE_DATA['all'].filter(v => v.videoId !== currentId);

            // 2. 配列をランダムにシャッフル（Fisher-Yatesアルゴリズム）
            for (let i = allVideos.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allVideos[i], allVideos[j]] = [allVideos[j], allVideos[i]];
            }

            // 3. シャッフル後、上から最大30件を取り出す
            const chunk = allVideos.slice(0, 30);
            const timestamp = new Date().getTime();

            if (chunk.length === 0) {
                recGrid.innerHTML = `<div class="col-span-full text-center py-6 font-mono text-gray-400 dark:text-gray-700 text-xs uppercase">データがありません</div>`;
                recCountEl.innerText = `動画: 0`;
                return;
            }

            recGrid.innerHTML = chunk.map(v => `
                <div class="video-card overflow-hidden cursor-pointer shadow-xl bg-white border border-gray-200 dark:bg-[#141417] dark:border-transparent dark:hover:border-[#333336]" onclick="location.href='./watch.html?id=${v.videoId}'">
                    <div class="relative group">
                        <img src="./thumbnails/${v.videoId}.jpg?v=${timestamp}" class="w-full aspect-video object-cover bg-gray-200 dark:bg-gray-900" loading="lazy">
                    </div>
                    <div class="p-4 md:p-5">
                        <h3 class="text-[14px] font-bold line-clamp-2 text-gray-700 dark:text-gray-300 leading-relaxed tracking-wide">${v.title}</h3>
                        <div class="mt-3 md:mt-4 flex justify-between items-center text-[8px] text-gray-400 dark:text-gray-600 font-mono uppercase tracking-tighter">
                            <span>${v.publishedAt}</span>
                            <span>ID: ${v.videoId}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            recCountEl.innerText = `おすすめ動画: ${chunk.length}`;
