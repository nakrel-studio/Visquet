<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visquet - Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        // データ読み込みを明示
        document.write('<script src="videos_data.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+JP:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        /* プレイヤー：4:3固定 */
        .player-box { position: relative; width: 100%; padding-top: 75%; background: #000; }
        .player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-[#f8f9fa] dark:bg-[#0d0d0f] text-[#1e2022] dark:text-[#e1e1e6] min-h-screen">

    <header class="h-16 border-b border-gray-200 dark:border-[#222225] flex items-center px-6 md:px-12 justify-between sticky top-0 bg-[#f8f9fa] dark:bg-[#0d0d0f] z-50">
        <div class="flex items-center gap-8">
            <img src="Visquet 1.PNG" class="h-8 cursor-pointer" onclick="location.href='./index.html'">
            <nav class="hidden md:flex gap-6 text-xs font-mono uppercase text-gray-500">
                <a href="./index.html" class="hover:text-black dark:hover:text-white">Home</a>
                <span id="video-id-header">ID: ---</span>
            </nav>
        </div>
        <div class="text-[10px] font-mono text-gray-400">VISQUET_PLAYER_CORE_V2.1</div>
    </header>

    <div class="max-w-[1400px] mx-auto flex flex-col lg:flex-row p-4 md:p-8 gap-8">
        <main class="flex-grow">
            <div class="player-box shadow-2xl mb-6">
                <iframe id="youtube-player" src="" allowfullscreen></iframe>
            </div>
            <h1 id="video-title" class="text-xl md:text-2xl font-bold mb-2">読み込み中...</h1>
            <div id="video-date" class="text-xs font-mono text-gray-500 mb-6">---</div>
            <div id="video-description" class="p-4 bg-white dark:bg-[#141417] border border-gray-200 dark:border-[#222225] text-sm"></div>
        </main>

        <aside class="w-full lg:w-[350px] flex-shrink-0">
            <div class="text-xs font-mono uppercase mb-4 text-gray-500">Suggested Archive</div>
            <div id="rec-grid" class="flex flex-col gap-4"></div>
        </aside>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlH-GMToPdCL_b-k2n1bETAiNevkqcM5A",
            authDomain: "visquet-view.firebaseapp.com",
            projectId: "visquet-view",
            storageBucket: "visquet-view.firebasestorage.app",
            messagingSenderId: "110822314078",
            appId: "1:110822314078:web:0c4ca72bec50a0168324cf"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        const urlParams = new URLSearchParams(window.location.search);
        const currentId = urlParams.get('id');

        // データ描画実行
        if (typeof VISQUET_ARCHIVE_DATA !== 'undefined') {
            const target = VISQUET_ARCHIVE_DATA['all'].find(v => v.videoId === currentId);
            if (target) {
                document.getElementById('youtube-player').src = `https://www.youtube.com/embed/${currentId}?autoplay=1`;
                document.getElementById('video-title').innerText = target.title;
                document.getElementById('video-date').innerText = target.publishedAt;
                document.getElementById('video-id-header').innerText = `ID: ${target.videoId}`;
                document.getElementById('video-description').innerText = target.description || "説明はありません。";
            }
            
            // 関連動画レンダリング (右側一列)
            const recGrid = document.getElementById('rec-grid');
            VISQUET_ARCHIVE_DATA['all'].slice(0, 10).forEach(v => {
                const card = document.createElement('div');
                card.className = "flex gap-3 cursor-pointer hover:opacity-80";
                card.innerHTML = `
                    <div class="w-32 aspect-video bg-gray-200 flex-shrink-0">
                        <img src="./thumbnails/${v.videoId}.jpg" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <p class="text-xs font-bold line-clamp-2">${v.title}</p>
                        <p class="text-[10px] text-gray-500">${v.publishedAt}</p>
                    </div>`;
                card.onclick = () => location.href = `./watch.html?id=${v.videoId}`;
                recGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
