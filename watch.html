<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visquet - Player</title>
    
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwindのダークモードをクラス制御に設定
        tailwind.config = {
            darkMode: 'class'
        }
        document.write('<script src="videos_data.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+JP:wght@700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .brand-logo { font-family: 'Noto Serif JP', serif; font-weight: 700; user-select: none; }
        
        /* 📐 プレイヤー・カードの枠線と背景（完全に直角仕様） */
        .player-container { background: #000; border: 1px solid #222225; border-radius: 0px !important; }
        .video-card { border: 1px solid transparent; transition: all 0.25s ease; border-radius: 0px !important; }
        .video-card:hover { transform: translateY(-3px); }
        
        /* 💡 YouTube概要欄の改行規則、空白、長いURLの自動折り返しを維持するスタイル */
        .description-text { white-space: pre-wrap; word-break: break-word; }

        /* 💥 画面を飛び交う炎の火の粉（パーティクル）用スタイル */
        @keyframes fireFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
        .fire-particle {
            position: absolute; pointer-events: none;
            background: linear-gradient(to bottom, #ff7e15, #ff3c00);
            border-radius: 50%; z-index: 50;
            animation: fireFly 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="flex min-h-screen bg-[#f8f9fa] text-[#1e2022] dark:bg-[#0d0d0f] dark:text-[#e1e1e6]">

    <aside class="w-52 sidebar hidden md:flex flex-col p-8 sticky top-0 h-screen bg-[#f0f2f5] border-r border-[#e2e8f0] dark:bg-[#0a0a0c] dark:border-r dark:border-[#222225]">
        <div class="flex items-center mb-10 cursor-pointer" onclick="location.href='./index.html'">
            <img src="Visquet 1.PNG" alt="Visquet Logo" class="h-10 md:h-12 w-auto object-contain block select-none dark:brightness-110">
        </div>
        
        <nav class="space-y-1 flex-grow text-sm">
            <div class="text-[10px] text-gray-400 dark:text-gray-600 uppercase tracking-[0.2em] mb-3 mt-2">Navigation</div>
            <div class="text-gray-500 hover:text-[#000] hover:bg-gray-200/50 dark:text-gray-400 dark:hover:text-white dark:hover:bg-white/5 p-3 rounded-none transition cursor-pointer flex items-center gap-2" onclick="location.href='./index.html'">
                <span>←</span> Back 
            </div>
        </nav>

        <div class="mt-auto pt-6 border-t border-gray-300 dark:border-gray-800 flex items-center justify-between">
            <div class="text-[9px] text-gray-400 dark:text-gray-700 font-mono tracking-tighter">
                SYS: VISQUET_PLAYER_v1.3 <span class="text-blue-600 dark:text-blue-500">STABLE_LOCAL_ENGINE</span>
            </div>
        </div>
    </aside>

    <main class="flex-grow p-6 md:p-12 max-w-5xl mx-auto w-full">
        
        <div class="md:hidden mb-6">
            <button onclick="location.href='./index.html'" class="text-xs text-gray-500 dark:text-gray-400 font-mono uppercase bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-800 px-4 py-2 rounded-none">
                ← Back
            </button>
        </div>

        <div class="player-container w-full aspect-[4/3] overflow-hidden shadow-2xl mb-6">
            <iframe id="youtube-player" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <div class="mb-6">
            <h1 id="video-title" class="text-xl md:text-2xl font-bold tracking-tight text-[#000] dark:text-white leading-snug">LOADING ARCHIVE...</h1>
            <div class="mt-3 flex flex-wrap items-center gap-4 text-xs font-mono text-gray-400 dark:text-gray-500 uppercase">
                <span id="video-date" class="font-semibold text-gray-700 dark:text-white">---</span>
                <span id="video-id" class="text-gray-400 dark:text-gray-600 text-[10px]">ID: ---</span>
            </div>

            <div class="mt-4 flex flex-wrap items-center gap-3 font-mono text-xs uppercase tracking-wider">
                <div class="border border-gray-200 dark:border-[#222225] px-4 py-2 bg-[#f0f2f5] dark:bg-[#0a0a0c] text-gray-500 dark:text-gray-400 font-bold">
                    VIEWS: <span id="view-count" class="text-gray-950 dark:text-white">0</span>
                </div>

                <button id="like-btn" onclick="handleLike()" class="group border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] hover:bg-blue-50/50 dark:hover:bg-blue-950/20 px-4 py-2 text-gray-600 dark:text-gray-300 transition-all duration-200 active:scale-90 flex items-center gap-2 rounded-none relative">
                    <span id="like-icon" class="transition-transform duration-200 group-hover:scale-110 inline-block">👍</span>
                    <span class="font-semibold">LIKE</span>
                    <span id="like-count" class="text-blue-600 dark:text-blue-400 font-extrabold ml-1 transition-transform duration-200">0</span>
                </button>

                <button id="fire-btn" onclick="handleFire(event)" class="group border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] hover:bg-orange-50/50 dark:hover:bg-orange-950/20 px-4 py-2 text-gray-600 dark:text-gray-300 transition-all duration-75 active:scale-95 flex items-center gap-2 rounded-none relative select-none overflow-visible">
                    <span id="fire-icon" class="inline-block transition-transform duration-75">🔥</span>
                    <span class="font-semibold tracking-widest">FIRE</span>
                    <span id="fire-count" class="text-orange-600 dark:text-orange-400 font-extrabold transition-transform duration-75">0</span>
                </button>
            </div>
        </div>
        
        <div class="p-6 rounded-none bg-white border border-gray-200 dark:bg-[#141417] dark:border-[#222225] mb-12">
            <h3 class="text-[10px] font-mono text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-3">/ Description</h3>
            <div id="video-description" class="description-text text-sm text-gray-600 dark:text-gray-300 leading-relaxed font-medium">
                データを展開しています...
            </div>
        </div>

        <section class="border-t border-gray-300 dark:border-gray-800 pt-8 pb-16">
            <div class="flex justify-end mb-6">
                <p id="rec-count" class="text-[10px] text-gray-400 dark:text-gray-600 font-mono uppercase tracking-tighter">SUGGEST: 0</p>
            </div>
            
            <div id="rec-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
            </div>
        </section>
    </main>

    <script>
        let currentVideoId = null;

        function syncTheme() {
            const theme = localStorage.getItem('visquet-theme') || 'light';
            const htmlEl = document.documentElement;

            if (theme === 'dark') {
                htmlEl.classList.add('dark');
            } else if (theme === 'light') {
                htmlEl.classList.remove('dark');
            } else if (theme === 'system') {
                const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (isSystemDark) {
                    htmlEl.classList.add('dark');
                } else {
                    htmlEl.classList.remove('dark');
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            syncTheme(); 

            const urlParams = new URLSearchParams(window.location.search);
            currentVideoId = urlParams.get('id');

            if (!currentVideoId) {
                location.href = './index.html';
                return;
            }

            const player = document.getElementById('youtube-player');
            player.src = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1&rel=0`;

            let targetVideo = null;
            if (typeof VISQUET_ARCHIVE_DATA !== 'undefined') {
                for (const key in VISQUET_ARCHIVE_DATA) {
                    const found = VISQUET_ARCHIVE_DATA[key].find(v => v.videoId === currentVideoId);
                    if (found) {
                        targetVideo = found;
                        break;
                    }
                }
            }

            if (targetVideo) {
                document.getElementById('video-title').innerHTML = targetVideo.title;
                document.getElementById('video-date').innerText = `${targetVideo.publishedAt} に投稿`;
                document.getElementById('video-id').innerText = `ID: ${targetVideo.videoId}`;
                
                document.title = `${targetVideo.title.replace(/&quot;/g, '"')} - Visquet`;

                const descContainer = document.getElementById('video-description');
                if (targetVideo.description && targetVideo.description.trim() !== "") {
                    descContainer.innerText = targetVideo.description;
                } else {
                    descContainer.innerHTML = `<span class="text-gray-400 dark:text-gray-600 font-mono text-xs">[ NO_DESCRIPTION_AVAILABLE ]</span>`;
                }
            } else {
                document.getElementById('video-title').innerText = "Archived Video Stream";
                document.getElementById('video-date').innerText = "UNKNOWN DATE";
                document.getElementById('video-id').innerText = `ID: ${currentVideoId}`;
                document.getElementById('video-description').innerText = "動画の文字情報をロードできませんでした。次回システム同期時に自動修復されます。";
            }

            // ⚡ 100%確実に動くローカルエンジンの駆動
            initLocalCounters();

            // 📑 関連動画のレンダリング
            renderRecommendations(currentVideoId);
        });

        // 📊 ローカルストレージベースの独立カウンタ処理
        function initLocalCounters() {
            // 1. 再生回数（セッション制限付き）
            let views = parseInt(localStorage.getItem(`v_count_${currentVideoId}`)) || Math.floor(Math.random() * 200) + 50; // 初期値がない場合はリアルな初期値を生成
            const hasViewed = sessionStorage.getItem(`v_session_${currentVideoId}`);
            
            if (!hasViewed) {
                views++;
                localStorage.setItem(`v_count_${currentVideoId}`, views);
                sessionStorage.setItem(`v_session_${currentVideoId}`, "true");
            }
            document.getElementById('view-count').innerText = views.toLocaleString();

            // 2. 高評価数（LIKE）の読み込み
            let likes = parseInt(localStorage.getItem(`l_count_${currentVideoId}`)) || Math.floor(views * 0.1) + 5;
            localStorage.setItem(`l_count_${currentVideoId}`, likes);
            document.getElementById('like-count').innerText = likes.toLocaleString();

            if (localStorage.getItem(`l_user_${currentVideoId}`)) {
                disableLikeButtonUI();
            }

            // 3. FIRE数の読み込み
            let fires = parseInt(localStorage.getItem(`f_count_${currentVideoId}`)) || Math.floor(views * 2.5) + 12;
            localStorage.setItem(`f_count_${currentVideoId}`, fires);
            document.getElementById('fire-count').innerText = fires.toLocaleString();

            updateFireButtonUI();
        }

        // 👍 LIKEボタンをクリック（1人1回だけ確実に弾む）
        function handleLike() {
            if (localStorage.getItem(`l_user_${currentVideoId}`)) return;

            const iconEl = document.getElementById('like-icon');
            const countEl = document.getElementById('like-count');
            
            iconEl.style.transform = 'scale(1.4)';
            countEl.style.transform = 'scale(1.3)';
            
            let likes = parseInt(localStorage.getItem(`l_count_${currentVideoId}`)) || 0;
            likes++;
            
            localStorage.setItem(`l_count_${currentVideoId}`, likes);
            localStorage.setItem(`l_user_${currentVideoId}`, "true"); // ユーザーが押したフラグ
            
            countEl.innerText = likes.toLocaleString();
            disableLikeButtonUI();
            
            setTimeout(() => {
                iconEl.style.transform = 'scale(1)';
                countEl.style.transform = 'scale(1)';
            }, 200);
        }

        function disableLikeButtonUI() {
            const btn = document.getElementById('like-btn');
            btn.classList.add('bg-blue-50', 'dark:bg-blue-950/20', 'border-blue-400', 'text-blue-600', 'cursor-not-allowed', 'opacity-90');
            document.getElementById('like-icon').innerText = '👍';
        }

        // 🔥 FIREボタン（50回連打・火の粉エフェクトが即座に発動）
        function handleFire(event) {
            let userFireClicks = parseInt(localStorage.getItem(`f_user_click_${currentVideoId}`)) || 0;
            if (userFireClicks >= 50) return; 

            createFireParticles(event);

            const iconEl = document.getElementById('fire-icon');
            const countEl = document.getElementById('fire-count');
            
            iconEl.style.transform = 'scale(1.3) rotate(-10deg)';
            countEl.style.transform = 'scale(1.2)';
            
            setTimeout(() => { 
                iconEl.style.transform = 'scale(1) rotate(0deg)'; 
                countEl.style.transform = 'scale(1)'; 
            }, 75);

            let fires = parseInt(localStorage.getItem(`f_count_${currentVideoId}`)) || 0;
            fires++;
            userFireClicks++;
            
            localStorage.setItem(`f_count_${currentVideoId}`, fires);
            localStorage.setItem(`f_user_click_${currentVideoId}`, userFireClicks);
            
            countEl.innerText = fires.toLocaleString();
            updateFireButtonUI();
        }

        // 💥 火の粉パーティクル
        function createFireParticles(e) {
            const btn = document.getElementById('fire-btn');
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let i = 0; i < 5; i++) {
                const p = document.createElement('div');
                p.classList.add('fire-particle');
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                
                const size = Math.random() * 5 + 3;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.setProperty('--x', `${(Math.random() - 0.5) * 60}px`);
                p.style.setProperty('--y', `${-Math.random() * 50 - 15}px`);

                btn.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        function updateFireButtonUI() {
            const userFireClicks = parseInt(localStorage.getItem(`f_user_click_${currentVideoId}`)) || 0;
            if (userFireClicks >= 50) {
                const btn = document.getElementById('fire-btn');
                btn.classList.add('bg-orange-50', 'dark:bg-orange-950/10', 'border-orange-400', 'text-orange-600', 'cursor-not-allowed', 'opacity-90');
            }
        }

        function renderRecommendations(currentId) {
            const recGrid = document.getElementById('rec-grid');
            const recCountEl = document.getElementById('rec-count');
            if (!recGrid || typeof VISQUET_ARCHIVE_DATA === 'undefined' || !VISQUET_ARCHIVE_DATA['all']) return;

            const allVideos = VISQUET_ARCHIVE_DATA['all'].filter(v => v.videoId !== currentId);
            
            const limit = 30;
            const chunk = allVideos.slice(0, limit);
            const timestamp = new Date().getTime();

            if (chunk.length === 0) {
                recGrid.innerHTML = `<div class="col-span-full text-center py-6 font-mono text-gray-400 dark:text-gray-700 text-xs uppercase">他に関連するデータがありません</div>`;
                recCountEl.innerText = `SUGGEST: 0`;
                return;
            }

            const htmlString = chunk.map(v => `
                <div class="video-card overflow-hidden cursor-pointer shadow-xl bg-white border border-gray-200 dark:bg-[#141417] dark:border-transparent dark:hover:border-[#333336]" onclick="location.href='./watch.html?id=${v.videoId}'">
                    <div class="relative group">
                        <img src="./thumbnails/${v.videoId}.jpg?v=${timestamp}" class="w-full aspect-video object-cover bg-gray-200 dark:bg-gray-900" loading="lazy">
                        <div class="absolute inset-0 bg-blue-600/10 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
                    </div>
                    <div class="p-4 md:p-5">
                        <h3 class="text-[11px] font-bold line-clamp-2 text-gray-700 dark:text-gray-300 leading-relaxed tracking-wide">${v.title}</h3>
                        <div class="mt-3 md:mt-4 flex justify-between items-center text-[8px] text-gray-400 dark:text-gray-600 font-mono uppercase tracking-tighter">
                            <span>${v.publishedAt}</span>
                            <span>ID: ${v.videoId}</span>
                        </div>
                    </div>
                </div>
            `).join('');

            recGrid.innerHTML = htmlString;
            recCountEl.innerText = `SUGGEST: ${chunk.length}`;
        }

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('visquet-theme') === 'system') {
                syncTheme();
            }
        });
    </script>
</body>
</html>
