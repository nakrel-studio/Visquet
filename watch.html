<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visquet - Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        document.write('<script src="videos_data.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+JP:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        /* プレイヤー：4:3固定用 */
        .player-box { position: relative; width: 100%; padding-top: 75%; background: #000; }
        .player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-[#f8f9fa] dark:bg-[#0d0d0f] text-[#1e2022] dark:text-[#e1e1e6] min-h-screen">

    <header class="h-16 border-b border-gray-200 dark:border-[#222225] flex items-center px-6 md:px-12 justify-between sticky top-0 bg-[#f8f9fa]/90 dark:bg-[#0d0d0f]/90 backdrop-blur z-50">
        <div class="flex items-center gap-8">
            <img src="Visquet 1.PNG" class="h-8 cursor-pointer" onclick="location.href='./index.html'">
            <nav class="hidden md:flex gap-6 text-xs font-mono uppercase text-gray-500">
                <a href="./index.html" class="hover:text-black dark:hover:text-white">Home</a>
                <span class="text-gray-300">/</span>
                <span id="video-id-header">ID: ---</span>
            </nav>
        </div>
        <div class="text-[10px] font-mono text-gray-400">VISQUET_PLAYER_CORE</div>
    </header>

    <div class="max-w-[1400px] mx-auto flex flex-col lg:flex-row p-4 md:p-8 gap-8">
        
        <main class="flex-grow">
            <div class="player-box shadow-2xl mb-6">
                <iframe id="youtube-player" src="" allowfullscreen></iframe>
            </div>
            <h1 id="video-title" class="text-xl md:text-2xl font-bold mb-2">LOADING...</h1>
            <div id="video-date" class="text-xs font-mono text-gray-500 mb-6">---</div>
            
            <div class="p-4 bg-white dark:bg-[#141417] border border-gray-200 dark:border-[#222225] text-sm">
                <div id="video-description">Loading...</div>
            </div>
        </main>

        <aside class="w-full lg:w-[350px] flex-shrink-0">
            <div class="text-xs font-mono uppercase mb-4 text-gray-500">Suggested Archive</div>
            <div id="rec-grid" class="flex flex-col gap-4"></div>
        </aside>
    </div>

    <script type="module">
        // 以前の実装を継承し、renderRecommendationsでサムネ比率16:9を維持しつつ出力してください
        // ロジックをここに統合します
    </script>
</body>
</html>
