<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visquet - Player</title>
    
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
        document.write('<script src="videos_data.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+JP:wght@700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            transition: background-color 0.25s ease, color 0.25s ease;
        }
        .brand-logo { font-family: 'Noto Serif JP', serif; font-weight: 700; user-select: none; }
        .player-container { background: #000; border: 1px solid #222225; border-radius: 0px !important; }
        .video-card { border: 1px solid transparent; transition: all 0.25s ease; border-radius: 0px !important; }
        .video-card:hover { transform: translateY(-2px); }
        .description-text { white-space: pre-wrap; word-break: break-word; }

        @keyframes fireFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
        .fire-particle {
            position: absolute; pointer-events: none;
            background: linear-gradient(to bottom, #ff7e15, #ff3c00);
            border-radius: 50%; z-index: 50;
            animation: fireFly 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        /* 🟢 スクロールバーをスタイリッシュに隠す、または細くする設定 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex min-h-screen bg-[#f8f9fa] text-[#1e2022] dark:bg-[#0d0d0f] dark:text-[#e1e1e6]">

    <aside class="w-52 sidebar hidden md:flex flex-col p-8 sticky top-0 h-screen bg-[#f0f2f5] border-r border-[#e2e8f0] dark:bg-[#0a0a0c] dark:border-r dark:border-[#222225]">
        <div class="flex items-center mb-10 cursor-pointer" onclick="location.href='./index.html'">
            <img src="Visquet 1.PNG" alt="Visquet Logo" class="h-10 md:h-12 w-auto object-contain block select-none dark:brightness-110">
        </div>
        
        <nav class="space-y-1 flex-grow text-sm">
            <div class="text-[10px] text-gray-400 dark:text-gray-600 uppercase tracking-[0.2em] mb-3 mt-2">Navigation</div>
            <div class="text-gray-500 hover:text-[#000] hover:bg-gray-200/50 dark:text-gray-400 dark:hover:text-white dark:hover:bg-white/5 p-3 rounded-none transition cursor-pointer flex items-center gap-2" onclick="location.href='./index.html'">
                <span>←</span> Back 
            </div>
        </nav>

        <div class="mt-auto pt-6 border-t border-gray-300 dark:border-gray-800 flex items-center justify-between">
            <div class="text-[9px] text-gray-400 dark:text-gray-700 font-mono tracking-tighter">
                SYS: VISQUET_PLAYER_v1.7 <span class="text-blue-600 dark:text-blue-500">FIXED_SCROLL_ENGAGED</span>
            </div>
        </div>
    </aside>

    <main class="flex-grow p-4 md:p-8 max-w-6xl mx-auto w-full flex flex-col lg:flex-row gap-6 h-screen overflow-hidden">
        
        <div class="flex-grow lg:w-2/3 flex flex-col h-full overflow-y-auto pr-1 custom-scrollbar">
            <div class="md:hidden mb-4">
                <button onclick="location.href='./index.html'" class="text-xs text-gray-500 dark:text-gray-400 font-mono uppercase bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-800 px-4 py-2 rounded-none">
                    ← Back
                </button>
            </div>

            <div class="player-container w-full aspect-[4/3] overflow-hidden shadow-2xl mb-4">
                <iframe id="youtube-player" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>

            <div class="mb-4">
                <h1 id="video-title" class="text-lg md:text-xl font-bold tracking-tight text-[#000] dark:text-white leading-snug">LOADING ARCHIVE...</h1>
                <div class="mt-2 flex flex-wrap items-center gap-4 text-xs font-mono text-gray-400 dark:text-gray-500 uppercase">
                    <span id="video-date" class="font-semibold text-gray-700 dark:text-white">---</span>
                    <span id="video-id" class="text-gray-400 dark:text-gray-600 text-[10px]">ID: ---</span>
                </div>

                <div class="mt-4 flex flex-wrap items-center gap-3 font-mono text-xs uppercase tracking-wider">
                    <div class="border border-gray-200 dark:border-[#222225] px-4 py-2 bg-[#f0f2f5] dark:bg-[#0a0a0c] text-gray-500 dark:text-gray-400 font-bold">
                        VIEWS: <span id="view-count" class="text-gray-950 dark:text-white">0</span>
                    </div>

                    <button id="like-btn" class="group border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] hover:bg-blue-50/50 dark:hover:bg-blue-950/20 px-4 py-2 text-gray-600 dark:text-gray-300 transition-all duration-200 active:scale-90 flex items-center gap-2 rounded-none relative">
                        <span id="like-icon" class="text-xl transition-transform duration-200 group-hover:scale-110 inline-block">👍</span>
                        <span class="font-semibold">LIKE</span>
                        <span id="like-count" class="text-blue-600 dark:text-blue-400 font-extrabold ml-1 transition-transform duration-200">0</span>
                    </button>

                    <button id="fire-btn" class="group border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] hover:bg-orange-50/50 dark:hover:bg-orange-950/20 px-4 py-2 text-gray-600 dark:text-gray-300 transition-all duration-75 active:scale-95 flex items-center gap-2 rounded-none relative select-none overflow-visible">
                        <span id="fire-icon" class="text-xl inline-block transition-transform duration-75">🔥</span>
                        <span class="font-semibold tracking-widest">FIRE</span>
                        <span id="fire-count" class="text-orange-600 dark:text-orange-400 font-extrabold transition-transform duration-75">0</span>
                    </button>
                </div>
            </div>
            
            <div class="p-5 rounded-none bg-white border border-gray-200 dark:bg-[#141417] dark:border-[#222225] mb-6">
                <h3 class="text-[10px] font-mono text-gray-400 dark:text-gray-500 uppercase tracking-widest mb-2">/ Description</h3>
                <div id="video-description" class="description-text text-sm text-gray-600 dark:text-gray-300 leading-relaxed font-medium">
                    データを展開しています...
                </div>
            </div>
        </div>
        
        <div class="w-full lg:w-1/3 flex flex-col border-t lg:border-t-0 lg:border-l border-gray-200 dark:border-[#222225] pt-4 lg:pt-0 lg:pl-6 h-full">
            <div class="flex justify-between items-center mb-4 flex-shrink-0">
                <h2 class="text-xs font-mono text-gray-400 dark:text-gray-500 uppercase tracking-widest">/ Suggested Archive</h2>
                <p id="rec-count" class="text-[10px] text-gray-400 dark:text-gray-600 font-mono uppercase tracking-tighter">SUGGEST: 0</p>
            </div>
            <div id="rec-grid" class="flex flex-col gap-4 overflow-y-auto h-full pb-16 pr-1 custom-scrollbar"></div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlH-GMToPdCL_b-k2n1bETAiNevkqcM5A",
            authDomain: "visquet-view.firebaseapp.com",
            projectId: "visquet-view",
            storageBucket: "visquet-view.firebasestorage.app",
            messagingSenderId: "110822314078",
            appId: "1:110822314078:web:0c4ca72bec50a0168324cf"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentVideoId = null;

        function syncTheme() {
            const theme = localStorage.getItem('visquet-theme') || 'light';
            const htmlEl = document.documentElement;
            if (theme === 'dark') htmlEl.classList.add('dark');
            else if (theme === 'light') htmlEl.classList.remove('dark');
        }

        document.addEventListener("DOMContentLoaded", () => {
            syncTheme(); 

            const urlParams = new URLSearchParams(window.location.search);
            currentVideoId = urlParams.get('id');

            if (!currentVideoId) {
                location.href = './index.html';
                return;
            }

            const player = document.getElementById('youtube-player');
            player.src = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1&rel=0`;

            let targetVideo = null;
            if (typeof VISQUET_ARCHIVE_DATA !== 'undefined') {
                for (const key in VISQUET_ARCHIVE_DATA) {
                    const found = VISQUET_ARCHIVE_DATA[key].find(v => v.videoId === currentVideoId);
                    if (found) { targetVideo = found; break; }
                }
            }

            if (targetVideo) {
                document.getElementById('video-title').innerHTML = targetVideo.title;
                document.getElementById('video-date').innerText = `${targetVideo.publishedAt} に投稿`;
                document.getElementById('video-id').innerText = `ID: ${targetVideo.videoId}`;
                document.title = `${targetVideo.title.replace(/&quot;/g, '"')} - Visquet`;
                const descContainer = document.getElementById('video-description');
                if (targetVideo.description && targetVideo.description.trim() !== "") {
                    descContainer.innerText = targetVideo.description;
                } else {
                    descContainer.innerHTML = `<span class="text-gray-400 dark:text-gray-600 font-mono text-xs">[ NO_DESCRIPTION_AVAILABLE ]</span>`;
                }
            } else {
                document.getElementById('video-title').innerText = "Archived Video Stream";
                document.getElementById('video-date').innerText = "UNKNOWN DATE";
                document.getElementById('video-id').innerText = `ID: ${currentVideoId}`;
                document.getElementById('video-description').innerText = "動画情報をロードできませんでした。";
            }

            const likeBtn = document.getElementById('like-btn');
            const fireBtn = document.getElementById('fire-btn');
            if (likeBtn) likeBtn.addEventListener('click', handleLike);
            if (fireBtn) fireBtn.addEventListener('click', handleFire);

            initLocalCounters();
            renderRecommendations(currentVideoId);
        });

        async function initLocalCounters() {
            if (!currentVideoId) return;
            const docRef = doc(db, "video_metrics", currentVideoId);

            const hasViewed = sessionStorage.getItem(`v_session_${currentVideoId}`);
            if (!hasViewed) {
                try {
                    await setDoc(docRef, { views: increment(1) }, { merge: true });
                    sessionStorage.setItem(`v_session_${currentVideoId}`, "true");
                } catch (e) {
                    console.error("Firebase Views Sync Error:", e);
                }
            }

            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('view-count').innerText = (data.views || 0).toLocaleString();
                    document.getElementById('like-count').innerText = (data.likes || 0).toLocaleString();
                    document.getElementById('fire-count').innerText = (data.fires || 0).toLocaleString();
                } else {
                    document.getElementById('view-count').innerText = "0";
                    document.getElementById('like-count').innerText = "0";
                    document.getElementById('fire-count').innerText = "0";
                }
            });

            if (localStorage.getItem(`l_user_${currentVideoId}`)) disableLikeButtonUI();
            updateFireButtonUI();
        }

        async function handleLike(event) {
            if (localStorage.getItem(`l_user_${currentVideoId}`)) return;

            createPopupText(event, "+1 MAX", "text-blue-500 font-black");

            const iconEl = document.getElementById('like-icon');
            const countEl = document.getElementById('like-count');
            iconEl.style.transform = 'scale(1.4)';
            countEl.style.transform = 'scale(1.3)';
            
            const docRef = doc(db, "video_metrics", currentVideoId);
            try {
                await setDoc(docRef, { likes: increment(1) }, { merge: true });
                localStorage.setItem(`l_user_${currentVideoId}`, "true");
                disableLikeButtonUI();
            } catch (e) {
                console.error("Like Error:", e);
            }
            
            setTimeout(() => {
                iconEl.style.transform = 'scale(1)';
                countEl.style.transform = 'scale(1)';
            }, 200);
        }

        function disableLikeButtonUI() {
            const btn = document.getElementById('like-btn');
            if (btn) {
                btn.classList.add('bg-gray-300', 'text-gray-600', 'border-gray-400', 'dark:bg-gray-800', 'dark:text-gray-400', 'dark:border-gray-700', 'cursor-not-allowed', 'pointer-events-none');
                btn.classList.remove('hover:bg-blue-50/50', 'dark:hover:bg-blue-950/20');
            }
        }

        async function handleFire(event) {
            let userFireClicks = parseInt(localStorage.getItem(`f_user_click_${currentVideoId}`)) || 0;
            if (userFireClicks >= 50) return; 

            createFireParticles(event);
            userFireClicks++;

            if (userFireClicks >= 50) {
                createPopupText(event, `+${userFireClicks} LIMIT !`, "text-red-500 font-black");
            } else {
                createPopupText(event, `+${userFireClicks}`, "text-orange-500 font-bold");
            }

            const iconEl = document.getElementById('fire-icon');
            const countEl = document.getElementById('fire-count');
            iconEl.style.transform = 'scale(1.3) rotate(-10deg)';
            countEl.style.transform = 'scale(1.2)';
            
            setTimeout(() => { 
                iconEl.style.transform = 'scale(1) rotate(0deg)'; 
                countEl.style.transform = 'scale(1)'; 
            }, 75);

            const docRef = doc(db, "video_metrics", currentVideoId);
            try {
                await setDoc(docRef, { fires: increment(1) }, { merge: true });
                localStorage.setItem(`f_user_click_${currentVideoId}`, userFireClicks);
                updateFireButtonUI();
            } catch (e) {
                console.error("Fire Error:", e);
            }
        }

        function createFireParticles(e) {
            const btn = document.getElementById('fire-btn');
            if (!btn) return;
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            for (let i = 0; i < 7; i++) {
                const p = document.createElement('div');
                p.classList.add('fire-particle');
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                
                const size = Math.random() * 8 + 6;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                
                p.style.setProperty('--x', `${(Math.random() - 0.5) * 100}px`);
                p.style.setProperty('--y', `${-Math.random() * 80 - 30}px`);
                
                btn.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        function createPopupText(e, text, colorClass) {
            const btn = e.currentTarget;
            if (!btn) return;

            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const randomXOffset = (Math.random() - 0.5) * 30;

            const popup = document.createElement('div');
            popup.innerText = text;
            
            popup.className = `absolute pointer-events-none font-mono font-black text-xs px-1.5 py-0.5 bg-white dark:bg-[#141417] border border-gray-300 dark:border-[#222225] shadow-md z-50 ${colorClass} rounded-none`;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            popup.style.transform = 'translate(-50%, -100%)';
            popup.style.transition = 'all 1.8s cubic-bezier(0.1, 0.8, 0.1, 1)';

            btn.appendChild(popup);

            requestAnimationFrame(() => {
                popup.style.top = `${y - 75}px`;
                popup.style.left = `${x + randomXOffset}px`;
                popup.style.opacity = '0';
                popup.style.transform = 'translate(-50%, -100%) scale(0.9)';
            });

            setTimeout(() => popup.remove(), 1800);
        }

        function updateFireButtonUI() {
            const userFireClicks = parseInt(localStorage.getItem(`f_user_click_${currentVideoId}`)) || 0;
            if (userFireClicks >= 50) {
                const btn = document.getElementById('fire-btn');
                if (btn) {
                    btn.classList.add('bg-gray-300', 'text-gray-600', 'border-gray-400', 'dark:bg-gray-800', 'dark:text-gray-400', 'dark:border-gray-700', 'cursor-not-allowed', 'pointer-events-none');
                    btn.classList.remove('hover:bg-orange-50/50', 'dark:hover:bg-orange-950/20');
                }
            }
        }

        // 🟢 【右側1列＆サムネイルアスペクト比完全固定版】
        function renderRecommendations(currentId) {
            const recGrid = document.getElementById('rec-grid');
            const recCountEl = document.getElementById('rec-count');
            if (!recGrid || typeof VISQUET_ARCHIVE_DATA === 'undefined' || !VISQUET_ARCHIVE_DATA['all']) return;

            const allVideos = VISQUET_ARCHIVE_DATA['all'].filter(v => v.videoId !== currentId);
            const chunk = allVideos.slice(0, 20); // 独立スクロールできるため、件数を多めの20件に調整
            const timestamp = new Date().getTime();

            if (chunk.length === 0) {
                recGrid.innerHTML = `<div class="text-center py-6 font-mono text-gray-400 dark:text-gray-700 text-xs uppercase">他に関連するデータがありません</div>`;
                recCountEl.innerText = `SUGGEST: 0`;
                return;
            }

            // 🟢 画像の親枠を「w-full aspect-video overflow-hidden」で包み、中のimgを「w-full h-full object-cover」にすることで大画面でも絶対に潰れないようにガード
            recGrid.innerHTML = chunk.map(v => `
                <div class="video-card overflow-hidden cursor-pointer shadow-md bg-white border border-gray-200 dark:bg-[#141417] dark:border-transparent dark:hover:border-[#333336] w-full flex flex-col flex-shrink-0" onclick="location.href='./watch.html?id=${v.videoId}'">
                    <div class="w-full aspect-video overflow-hidden bg-gray-200 dark:bg-gray-900">
                        <img src="./thumbnails/${v.videoId}.jpg?v=${timestamp}" class="w-full h-full object-cover" loading="lazy">
                    </div>
                    <div class="p-3">
                        <h3 class="text-[11px] font-bold line-clamp-2 text-gray-700 dark:text-gray-300 leading-normal tracking-wide">${v.title}</h3>
                        <div class="mt-2 flex justify-between items-center text-[8px] text-gray-400 dark:text-gray-600 font-mono uppercase tracking-tighter">
                            <span>${v.publishedAt}</span>
                            <span>ID: ${v.videoId}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            recCountEl.innerText = `SUGGEST: ${chunk.length}`;
        }
    </script>
</body>
</html>
