<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visquet - Player</title>
    
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        document.write('<script src="videos_data.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+JP:wght@700&display=swap');
        body { background-color: #0d0d0f; color: #e1e1e6; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .brand-logo { font-family: 'Noto Serif JP', serif; font-weight: 700; color: #fff; }
        .sidebar { border-right: 1px solid #222225; background-color: #0a0a0c; z-index: 40; }
        .player-container { background: #000; border: 1px solid #222225; }
        /* 💡 YouTube概要欄の改行規則、空白、長いURLの自動折り返しを維持するスタイル */
        .description-text { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-48 sidebar hidden md:flex flex-col p-8 sticky top-0 h-screen">
        <div class="brand-logo text-3xl mb-12 tracking-tight cursor-pointer" onclick="location.href='./index.html'">Visquet</div>
        
        <nav class="space-y-1 flex-grow text-sm">
            <div class="text-[10px] text-gray-600 uppercase tracking-[0.2em] mb-3 mt-2">Navigation</div>
            <div class="text-gray-400 hover:text-white p-3 rounded-lg transition cursor-pointer flex items-center gap-2" onclick="location.href='./index.html'">
                <span>←</span> Back 
            </div>
        </nav>

        <div class="mt-auto pt-6 border-t border-gray-800 flex items-center justify-between">
            <div class="text-[9px] text-gray-700 font-mono tracking-tighter">
                SYS: VISQUET_PLAYER_v1.1 <span class="text-blue-500">STAGE_READY</span>
            </div>
        </div>
    </aside>

    <main class="flex-grow p-6 md:p-12 max-w-5xl mx-auto w-full">
        
        <div class="md:hidden mb-6">
            <button onclick="location.href='./index.html'" class="text-xs text-gray-400 font-mono uppercase bg-gray-900 border border-gray-800 px-4 py-2 rounded-full">
                ← Back
            </button>
        </div>

        <div class="player-container w-full aspect-[4/3] rounded-2xl overflow-hidden shadow-2xl mb-6">
            <iframe id="youtube-player" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>

        <div class="mb-6">
            <h1 id="video-title" class="text-xl md:text-2xl font-bold tracking-tight text-white leading-snug">LOADING ARCHIVE...</h1>
            <div class="mt-3 flex flex-wrap items-center gap-4 text-xs font-mono text-gray-400 uppercase">
                <span id="video-date" class="font-semibold text-white">---</span>
                <span id="video-id" class="text-gray-600 text-[10px]">ID: ---</span>
            </div>
        </div>
        
        <div class="bg-[#141417] border border-[#222225] p-6 rounded-xl">
            <h3 class="text-[10px] font-mono text-gray-500 uppercase tracking-widest mb-3">/ Description</h3>
            <div id="video-description" class="description-text text-sm text-gray-300 leading-relaxed font-medium">
                データを展開しています...
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. URLパラメータから「?id=動画ID」を取得
            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('id');

            if (!videoId) {
                // IDが見当たらないか不正な場合は安全のためトップへ戻す
                location.href = './index.html';
                return;
            }

            // 2. プレイヤーを即座に生成（autoplay=1 で自動再生、rel=0 で終了後の他人の関連動画を抑制）
            const player = document.getElementById('youtube-player');
            player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;

            // 3. 読み込まれている videos_data.js 内の全カテゴリから対象の動画データを検索
            let targetVideo = null;
            if (typeof VISQUET_ARCHIVE_DATA !== 'undefined') {
                for (const key in VISQUET_ARCHIVE_DATA) {
                    const found = VISQUET_ARCHIVE_DATA[key].find(v => v.videoId === videoId);
                    if (found) {
                        targetVideo = found;
                        break;
                    }
                }
            }

            // 4. 取得した静的データを各要素に流し込む
            if (targetVideo) {
                document.getElementById('video-title').innerHTML = targetVideo.title;
                document.getElementById('video-date').innerText = `${targetVideo.publishedAt} に投稿`;
                document.getElementById('video-id').innerText = `ID: ${targetVideo.videoId}`;
                
                // ブラウザのタブ名も動画タイトルに自動変更（クォーテーションの文字化け対策込み）
                document.title = `${targetVideo.title.replace(/&quot;/g, '"')} - Visquet`;

                // 概要欄の挿入処理
                const descContainer = document.getElementById('video-description');
                if (targetVideo.description && targetVideo.description.trim() !== "") {
                    // textContent または innerText を使うことで、HTMLタグとしての誤動作を防ぎ安全にプレーンテキストとして展開
                    descContainer.innerText = targetVideo.description;
                } else {
                    descContainer.innerHTML = `<span class="text-gray-600 font-mono text-xs">[ NO_DESCRIPTION_AVAILABLE ]</span>`;
                }
            } else {
                // 自動更新（Actions）が回る前など、一時的にJS側にデータがなくても最低限IDから動作維持
                document.getElementById('video-title').innerText = "Archived Video Stream";
                document.getElementById('video-date').innerText = "UNKNOWN DATE";
                document.getElementById('video-id').innerText = `ID: ${videoId}`;
                document.getElementById('video-description').innerText = "動画の文字情報をロードできませんでした。次回システム同期時に自動修復されます。";
            }
        });
    </script>
</body>
</html>
