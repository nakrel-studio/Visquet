<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visquet - Player</title>
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        document.write('<script src="videos_data.js?v=' + new Date().getTime() + '"><\/script>');
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Serif+JP:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; transition: background-color 0.25s ease, color 0.25s ease; }
        .player-container { background: #000; border: 1px solid #222225; }
        .video-card { border: 1px solid transparent; transition: all 0.25s ease; }
        .video-card:hover { transform: translateY(-3px); }
        .description-text { white-space: pre-wrap; word-break: break-word; }
        @keyframes fireFly { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; } }
        .fire-particle { position: absolute; pointer-events: none; background: linear-gradient(to bottom, #ff7e15, #ff3c00); border-radius: 50%; z-index: 50; animation: fireFly 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
    </style>
</head>
<body class="min-h-screen bg-[#f8f9fa] text-[#1e2022] dark:bg-[#0d0d0f] dark:text-[#e1e1e6]">

    <header class="w-full h-20 bg-[#f0f2f5] dark:bg-[#0a0a0c] border-b border-[#e2e8f0] dark:border-[#222225] flex items-center justify-between px-8 md:px-12 sticky top-0 z-50">
        <div class="flex items-center gap-8">
            <img src="Visquet 1.PNG" alt="Visquet Logo" class="h-10 cursor-pointer dark:brightness-110" onclick="location.href='./index.html'">
            <button onclick="location.href='./index.html'" class="text-xs text-gray-500 dark:text-gray-400 font-mono uppercase bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-800 px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-800 transition">← Back</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 md:p-12 grid grid-cols-1 lg:grid-cols-[1fr,350px] gap-8">
        <div class="w-full">
            <div class="player-container w-full aspect-[4/3] overflow-hidden shadow-2xl mb-6">
                <iframe id="youtube-player" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <div class="mb-6">
                <h1 id="video-title" class="text-xl md:text-2xl font-bold tracking-tight text-[#000] dark:text-white">LOADING...</h1>
                <div class="mt-4 flex flex-wrap items-center gap-3 font-mono text-xs uppercase">
                    <div class="border border-gray-200 dark:border-[#222225] px-4 py-2 bg-[#f0f2f5] dark:bg-[#0a0a0c] text-gray-500">VIEWS: <span id="view-count" class="text-gray-950 dark:text-white">0</span></div>
                    <button id="like-btn" class="border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] px-4 py-2 flex items-center gap-2">👍 LIKE <span id="like-count" class="text-blue-500">0</span></button>
                    <button id="fire-btn" class="border border-gray-300 dark:border-[#222225] bg-white dark:bg-[#141417] px-4 py-2 flex items-center gap-2">🔥 FIRE <span id="fire-count" class="text-orange-500">0</span></button>
                </div>
            </div>
            <div class="p-6 bg-white border border-gray-200 dark:bg-[#141417] dark:border-[#222225]"><div id="video-description"></div></div>
        </div>
        <section class="w-full"><div id="rec-grid" class="grid grid-cols-1 gap-4"></div></section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAlH-GMToPdCL_b-k2n1bETAiNevkqcM5A", authDomain: "visquet-view.firebaseapp.com", projectId: "visquet-view", storageBucket: "visquet-view.firebasestorage.app", messagingSenderId: "110822314078", appId: "1:110822314078:web:0c4ca72bec50a0168324cf" }));
        let currentVideoId = new URLSearchParams(window.location.search).get('id');

        // キャッシュ付き取得関数（60秒間は通信しない）
        async function getMetricsWithCache(docRef, id) {
            const cacheKey = `cache_${id}`;
            const cached = localStorage.getItem(cacheKey);
            const time = localStorage.getItem(`time_${id}`);
            if (cached && time && (Date.now() - parseInt(time) < 60000)) return JSON.parse(cached);
            
            const snap = await getDoc(docRef);
            if (!snap.exists()) return null;
            const data = snap.data();
            localStorage.setItem(cacheKey, JSON.stringify(data));
            localStorage.setItem(`time_${id}`, Date.now().toString());
            return data;
        }

        async function updateUI() {
            const data = await getMetricsWithCache(doc(db, "video_metrics", currentVideoId), currentVideoId);
            if (data) {
                document.getElementById('view-count').innerText = (data.views || 0).toLocaleString();
                document.getElementById('like-count').innerText = (data.likes || 0).toLocaleString();
                document.getElementById('fire-count').innerText = (data.fires || 0).toLocaleString();
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            document.getElementById('youtube-player').src = `https://www.youtube.com/embed/${currentVideoId}?autoplay=1`;
            await updateUI();
            
            document.getElementById('like-btn').onclick = async (e) => {
                await setDoc(doc(db, "video_metrics", currentVideoId), { likes: increment(1) }, { merge: true });
                localStorage.removeItem(`time_${currentVideoId}`); // キャッシュ強制更新
                updateUI();
            };
            document.getElementById('fire-btn').onclick = async (e) => {
                await setDoc(doc(db, "video_metrics", currentVideoId), { fires: increment(1) }, { merge: true });
                localStorage.removeItem(`time_${currentVideoId}`); // キャッシュ強制更新
                updateUI();
            };
        });
    </script>
</body>
</html>
